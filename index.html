<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

</head>
<body>

    <style>
    
body {
    background-color: #ccd5ae;
    font-family: 'Montserrat', Arial, sans-serif;
    min-height: 100vh;
}

.box {
    width: 500px;
    height: 550px;
    margin: 80px auto;
    background-color: #fefae0;
    padding: 40px 35px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    border: 4px solid #e9edc9;
    border-radius: 25px;
}

h1 {
    color: #d4a373;
    font-weight: 800;
    font-size: 27px;
    margin-bottom: 10px;
}

.form-group {
    margin-top: 20px;
}

input[type="text"] {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #d4a373;
    border-radius: 12px;
    background-color: #fffaf7;
    outline: none;
}

input[type="text"]:focus {
    border-color: #d4a373;
    box-shadow: 0 0 5px rgba(154, 88, 26, 0.3);
}

.generate-button {
    display: block;
    margin: 20px auto;
    background-color: #d4a373;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 11px 35px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.generate-button:hover {
    background-color: #d4a373;
 
}

.inner {
    background-color: #fefae0;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    min-height: 200px;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

.inner h3 {
    color: #d4a373;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

.inner p {
    margin-bottom: 12px;
    color: #d4a373;
    font-size: 14px;
}

    </style>
    
    <div class="box rounded-5">
        <div class="form-group">

        <div>
        <h1 class="text-center">Periodic Table of Elements</h1>
        <p class="text-center">Enter an element to search</p>
        </div>
        
        
        <input type="text" id='element1' placeholder="Example: H (for Hydrogen)">
        <br>
        <button py-click="search_element" class="generate-button">Search Element</button>
        </div>
        <br>
        <div id="output" class="inner result">
            <h3>Show Result</h3>
            <br>      
            <p><b>Element Symbol:</b><span id="symbol"></span></p>
            <p><b>Element Name:</b><span id="name"></span></p>
            <p><b>Atomic Number:</b><span id="number"></span></p>
            <p><b>Atomic Mass:</b><span id="mass"></span></p>
        </div>

    <script type="py" src="main.py"></script>

    </div>

</body>
</html>
